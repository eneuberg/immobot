<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{% endblock %} · immobot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f766e'/%3E%3Cpath d='M6 11.5 12 7l6 4.5V18h-4v-4h-4v4H6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css"
        integrity="sha384-7P0NVe9LPDbUCAF+fH2R8Egwz1uqNH83Ns/bfJY0fN2XCDBMUI2S9gGzIOIRBKsA" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
  {% block nav %}
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11 12 4.5 20 11v8.5a.5.5 0 0 1-.5.5H15v-5.5H9V20H4.5a.5.5 0 0 1-.5-.5z"/></svg></span>
        <span>immobot</span>
      </a>
      <nav class="tabs" aria-label="Hauptmenü">
        <a href="/" {% if active == "listings" %}aria-current="page"{% endif %}>Inserate</a>
        <a href="/settings" {% if active == "settings" %}aria-current="page"{% endif %}>Einstellungen</a>
        <a href="/credentials" {% if active == "credentials" %}aria-current="page"{% endif %}>Zugänge</a>
        <a href="/status" {% if active == "status" %}aria-current="page"{% endif %}>Status</a>
      </nav>
      <form class="logout" method="post" action="/logout"><button type="submit" title="Abmelden (beendet alle Sitzungen)">Abmelden</button></form>
    </div>
  </header>
  {% endblock %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
