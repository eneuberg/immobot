{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="login-wrap">
  <article class="login">
    <span class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11 12 4.5 20 11v8.5a.5.5 0 0 1-.5.5H15v-5.5H9V20H4.5a.5.5 0 0 1-.5-.5z"/></svg></span>
      <span>immobot</span>
    </span>
    <h1>Anmelden</h1>
    <p>Wohnungsinserate und Anschreiben-Entwürfe.</p>
    {% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Passwort
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <button type="submit">Anmelden</button>
    </form>
  </article>
</div>
{% endblock %}
